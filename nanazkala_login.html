<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nanazkala login</title>
    <link rel="icon" href="./sabz-fav.png">
    <link rel="stylesheet" href="./app.css">
</head>
<body>
    <form action="./nanazkala.html">
        <legend>ساخت حساب کاربری</legend>
        <br>
        <label for="username">username:</label>
        <br>
        <input type="text" id="username" required placeholder="enter user name"
        name="username"  autofocus>
        <br>
        <label for="email">email:</label>
        <br>
        <input type="email" required placeholder="please enter your email" id="email"
        name="email">
        <br>
        <label for="password">password:</label>
        <input type="password" required min="3" max="9" placeholder="enter password"
         id="password" name="password">
         <br>
         <label for="password">password confairm:</label>
        <input type="password" required min="3" max="9" placeholder="enter password"
         id="passwordconfairm" name="passwordconfairm">
        <br>
         <label for="aprove" >من قوانین  <span><a href="./nanazkala.html">نانازکالا</a></span> را قبول میکنم</label>
         <input type="checkbox" id="aprove" required name="aprove">
         <br>
         <br>
         <button type="submit">submit</button>
    </form>
</body>
</html>
